services:

  #  API (Express + Puppeteer)
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV:     production
      PORT:         3000
      DB_HOST:      ${DB_HOST:-192.168.1.3}
      DB_PORT:      ${DB_PORT:-5432}
      DB_NAME:      ${DB_NAME:-invoice_generator}
      DB_USER:      ${DB_USER:-nesticle8bit}
      DB_PASSWORD:  ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_SSL:       ${DB_SSL:-false}
      # Required: the API refuses to boot without a strong secret.
      JWT_SECRET:   ${JWT_SECRET:?JWT_SECRET is required (min 32 chars)}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      # Pending migrations run before the API accepts traffic.
      AUTO_MIGRATE: ${AUTO_MIGRATE:-true}
      UPLOAD_DIR:   uploads
    volumes:
      - uploads:/app/uploads
    # Reaps Chromium's orphaned children — without it they pile up as zombies.
    init: true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      # Generous: the container applies pending migrations before it listens.
      start_period: 45s
    deploy:
      resources:
        limits:
          # Chromium is memory-hungry; without a ceiling it can take down the host.
          memory: 1g
    # Chromium needs more than the default 64MB of shared memory.
    shm_size: 512mb

  #  UI (Angular → nginx)
  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128m

volumes:
  uploads:

networks:
  default:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
