name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: invoice_generator_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      # Test-only value; production secrets never live in the repo.
      JWT_SECRET: ci-secret-long-enough-to-pass-validation-0123456789
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: invoice_generator_test
      DB_USER: postgres
      DB_PASSWORD: postgres
      # Chromium is not needed for the test suite.
      PUPPETEER_SKIP_DOWNLOAD: 'true'

    defaults:
      run:
        working-directory: api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: api/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Migrate test database
        run: npx tsx src/config/migrate.ts

      - name: Test
        run: npm test

  ui:
    name: UI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ui

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        # Chrome is preinstalled on ubuntu-latest runners.
        run: npm test

      - name: Build
        run: npm run build
