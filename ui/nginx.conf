server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Increase body size limit for logo/signature uploads
    client_max_body_size 15m;

    # ---- Compression ----
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    # ---- Security headers ----
    add_header X-Frame-Options        "SAMEORIGIN"            always;
    add_header X-Content-Type-Options "nosniff"               always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy     "camera=(), microphone=(), geolocation=(), payment=()" always;
    # Origins allowed by index.html: Google Fonts, the Tabler icon webfont on
    # jsDelivr, and the self-hosted Umami analytics script.
    add_header Content-Security-Policy
        "default-src 'self'; script-src 'self' https://analytics.juliopoveda.com; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' data: https://fonts.gstatic.com https://cdn.jsdelivr.net; connect-src 'self' https://analytics.juliopoveda.com; object-src 'none'; frame-ancestors 'self'; base-uri 'self'" always;

    # Proxy all API requests to the backend container
    location /api/ {
        proxy_pass         http://api:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Proxy uploaded files (logos, signatures)
    location /uploads/ {
        proxy_pass         http://api:3000/uploads/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        # Filenames are unique per upload, so they can be cached hard.
        expires            30d;
        add_header         Cache-Control "public, max-age=2592000" always;
    }

    # Hashed build artefacts never change under the same name.
    location ~* \.(?:js|css|woff2?|ttf|eot|otf|svg|png|jpg|jpeg|gif|webp|ico)$ {
        expires    1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files  $uri =404;
    }

    # index.html must always be revalidated, otherwise clients pin an old build.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # Angular client-side routing — always serve index.html for unknown paths
    location / {
        try_files $uri $uri/ /index.html;
    }
}
